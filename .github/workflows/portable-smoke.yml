name: Portable launch and conversation checks
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        timeout-minutes: 5
        run: python -m pip --disable-pip-version-check --retries 2 --timeout 20 install -r requirements.txt
      - name: Initialize local fixture settings
        timeout-minutes: 1
        run: python scripts/manage.py init
      - name: Offline checks (no QQ or model calls)
        timeout-minutes: 4
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          root = Path('group-bot') if Path('group-bot').is_dir() else Path('work/group-bot')
          for suite in ('test_portable_launch', 'test_member_labels', 'test_visual_response'):
              print(f'Running {suite}', flush=True)
              subprocess.run(
                  [sys.executable, '-X', 'faulthandler', '-m', 'unittest', '-v', suite],
                  cwd=root, check=True, timeout=60,
              )
